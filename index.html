<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIPHER — Human-Centred AI Business Ecosystem & Desk</title>
    <meta name="description" content="Better support. More room to grow. CIPHER helps your business respond to everyday questions, organize customer enquiries, and bring in a person whenever a conversation needs a human touch." />
    <meta property="og:title" content="CIPHER — Human-Centred AI Business Ecosystem" />
    <meta property="og:description" content="Better support. More room to grow. CIPHER helps your business respond to everyday questions and organize customer enquiries." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F7F9F6] text-[#27332B] font-['Inter',sans-serif] antialiased selection:bg-[#497A58] selection:text-white">
    <div id="root"></div>
    <script>
      // Suppress Vite HMR WebSocket connection errors in preview environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('closed without opened'))) {
          event.preventDefault();
        }
      });
      const OrigWebSocket = window.WebSocket;
      if (OrigWebSocket) {
        window.WebSocket = function(url, protocols) {
          try {
            return new OrigWebSocket(url, protocols);
          } catch (e) {
            const mockWs = {
              send() {},
              close() {},
              addEventListener() {},
              removeEventListener() {},
              readyState: 3,
              CLOSED: 3
            };
            return mockWs;
          }
        };
        window.WebSocket.prototype = OrigWebSocket.prototype;
        window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
        window.WebSocket.OPEN = OrigWebSocket.OPEN;
        window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
        window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
